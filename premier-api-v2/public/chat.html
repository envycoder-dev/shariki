<style>
.refcard{position:relative;margin-top:18px;padding:16px 16px 14px;border-radius:14px;background:linear-gradient(160deg,rgba(47,111,228,.16),rgba(255,255,255,.02) 46%);border:1px solid rgba(94,159,232,.38);overflow:hidden}

.rc-top{display:flex;gap:12px;align-items:center;position:relative}

.rc-link code{flex:1;min-width:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--accent-l);background:var(--code);border:1px solid var(--line2);border-radius:9px;padding:9px 11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-copy{flex:none;padding:8px 12px;font-size:13px}
.rc-stats{display:flex;gap:8px;margin-top:12px;position:relative}
.rc-stat{flex:1;display:flex;flex-direction:column;gap:1px;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.rc-stat b{font-size:16px;letter-spacing:.2px}
.rc-stat small{font-size:11.5px;color:var(--muted)}
.rc-warm{margin-top:8px;font-size:12.5px;color:var(--muted)}
.mst{display:flex;flex-direction:column;gap:8px;position:relative}
.mst-head{display:grid;grid-template-columns:minmax(0,1.5fr) 64px minmax(0,1fr);gap:10px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:0 2px}
.mst-row{display:grid;grid-template-columns:minmax(0,1.5fr) 64px minmax(0,1fr);gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.02)}
.mst-name{display:flex;gap:8px;align-items:flex-start;min-width:0}

.mst-dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:4px;background:var(--line2)}

.mst-cell{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mst-note{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:10px}
@media(max-width:600px){.mst-head,.mst-row{grid-template-columns:minmax(0,1.5fr) 64px}.mst-head span:nth-child(3),.mst-cell:last-child{display:none}}
.rc-prog{margin-top:14px;position:relative}
.rc-pt{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.rc-pt b{color:var(--text);white-space:nowrap}
.rc-tiers{display:grid;grid-template-columns:1fr 1fr;gap:7px 14px;margin-top:14px;position:relative}
.rc-tier{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);min-width:0}
.rc-tier span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--raised);border:1px solid var(--line2);color:var(--muted);flex:none}
.rc-n svg{width:12px;height:12px}
.rc-tier.done{color:var(--text)}
.rc-tier.done .rc-n{background:var(--accent);border-color:var(--accent);color:#fff}
.rc-chip{display:inline-flex;gap:7px;align-items:center;margin-top:14px;font-size:12.5px;color:var(--accent-l);background:var(--accent-t);border:1px solid rgba(94,159,232,.3);padding:7px 11px;border-radius:999px;position:relative}
.rc-chip svg{width:13px;height:13px}
:root{--bg:#0e0e0f;--side:#0a0a0b;--raised:#19191b;--hover:#1f1f21;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);--text:#ececec;--muted:rgba(255,255,255,.56);--dim:rgba(255,255,255,.36);--code:#121214;--accent:#2F6FE4;--accent-h:#3B7BF0;--accent-l:#7EADF5;--accent-t:rgba(94,159,232,.12)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
::selection{background:rgba(255,255,255,.22)}
html,body{height:100%}
@supports (height:100dvh){html,body{height:100dvh}}
body{background:var(--bg);color:var(--text);font:15.5px/1.65 Onest,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;display:flex;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}

button,.item,.side,.overlay{transition:background-color .18s ease,color .18s ease,border-color .18s ease,opacity .18s ease,transform .22s ease}

svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.ib:hover{background:var(--hover);color:var(--text)}

.side{width:260px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 10px}

.shead{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 14px 8px}

.scroll{flex:1;overflow:auto;min-height:0}

.col{transition:opacity .15s ease}

.cursor{animation:breathe 1.2s ease-in-out infinite!important}

.pbody{flex:1;position:relative;min-height:0}
.pbody iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.pbody pre{position:absolute;inset:0;overflow:auto;margin:0;padding:16px;font:13px/1.6 Menlo,Consolas,monospace;color:#d6d6d6;white-space:pre;tab-size:2}
.pbody .hide{display:none}
.pwait{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:14px;background:#0c0c0d}
.pack{max-width:520px;border:1px solid var(--line2);background:#141416;border-radius:12px;padding:12px 14px;margin:4px 0 10px}
.pack-h{display:flex;align-items:center;gap:12px}
.pack .art-t b{display:block;font-weight:550;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pack .art-t small{display:block;color:var(--dim);font-size:12.5px}
.pack-b{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pack-b .btn{height:32px;padding:0 12px;font-size:13px}
.pack-b .btn:disabled{opacity:.45;cursor:default}
.pack.building .art-ic{animation:breathe 1.6s ease-in-out infinite}
.fileb{max-width:100%;margin:0 0 6px}
.fileb summary{display:flex;align-items:center;gap:8px;list-style:none;cursor:pointer;padding:7px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px;color:var(--muted);transition:background-color .2s ease,color .2s ease}
.fileb summary::-webkit-details-marker{display:none}
.fileb summary:hover{background:var(--hover);color:var(--text)}
.fileb summary svg{width:15px;height:15px}
.fileb .fp{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;color:var(--text)}
.fileb summary small{color:var(--dim);font-size:12px;flex:none}
.fileb[open] summary{border-radius:9px 9px 0 0;border-bottom-color:transparent}
.fileb .pre{border-radius:0 0 10px 10px;margin:0}
.fileb .pre pre{max-height:420px;overflow:auto}
.art{display:flex;align-items:center;gap:12px;width:100%;max-width:440px;text-align:left;border:1px solid var(--line2);background:#141416;border-radius:12px;padding:12px 14px;margin:4px 0 14px}
.art:hover{background:var(--hover)}
.art.cur{border-color:rgba(255,255,255,.3)}
.art-ic{width:36px;height:36px;flex:none;border-radius:8px;background:var(--raised);display:grid;place-items:center;color:var(--muted)}
.art-t{flex:1;min-width:0}
.art b{display:block;font-weight:550;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art small{display:block;color:var(--dim);font-size:12.5px}
.art-go{font-size:12.5px;color:var(--muted);border:1px solid var(--line2);border-radius:6px;padding:3px 9px;flex:none}
.art.building .art-ic{animation:breathe 1.6s ease-in-out infinite}
@media (max-width:860px){.item .gear{opacity:1}.pane{position:fixed;inset:0;z-index:40;width:100%!important;display:none;border:0}.pane.on{display:block}.pane-in{width:100%}#pReload,#pCopy{display:none}}
.atts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.att{position:relative;display:flex;align-items:center;gap:8px;height:48px;padding:0 30px 0 10px;border:1px solid var(--line2);border-radius:10px;background:#19191b;max-width:240px;overflow:hidden;font-size:13px}
.att.img{width:48px;padding:0;overflow:hidden}
.att.img img{width:100%;height:100%;object-fit:cover}
.att .nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att small{display:block;color:var(--dim);font-size:11.5px}
.att .ai{width:28px;height:28px;border-radius:7px;background:var(--raised);display:grid;place-items:center;color:var(--muted);flex:none}
.att .ai svg{width:15px;height:15px}
.att .rm{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:var(--muted);background:rgba(20,20,22,.85);font-size:11px}
.att .rm:hover{color:var(--text)}
.att.loading{opacity:.6}
.box.drag{border-color:rgba(255,255,255,.4);background:#18181a}
.uatt{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-bottom:6px}
.uatt img{width:120px;height:90px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
.uatt .att{padding-right:12px;height:44px}
.item .gear{opacity:0;color:var(--dim);display:grid;place-items:center;width:22px;height:22px;border-radius:6px;flex:none}
.item .gear svg{width:14px;height:14px}
.item:hover .gear,.item.on .gear{opacity:1}
.item .gear:hover{color:var(--text);background:var(--hover)}
.pinfo{margin-top:18px;font-size:13px;color:var(--dim);max-width:520px}
.pinfo button{color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.pinfo button:hover{color:var(--text)}
.field textarea{width:100%;min-height:140px;max-height:340px;resize:vertical;background:#0f0f10;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;outline:0;font-size:14px;line-height:1.5}
.field textarea:focus{border-color:rgba(255,255,255,.3)}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);margin:2px 0 8px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:#ececec}
.btn.danger{color:#E97366;border-color:rgba(233,115,102,.35)}
.btn.danger:hover{background:rgba(233,115,102,.1)}
.btns .sp{flex:1}
.pubbar{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);flex:none}
.pubbar a{color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
.pubbar a:hover{text-decoration:underline}
.pubbar button{font-size:12.5px;color:var(--muted);border:1px solid var(--line2);border-radius:6px;padding:3px 9px;flex:none}
.pubbar button:hover{color:var(--text);background:var(--hover)}
.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-8px);background:#1d1d1f;border:1px solid var(--line2);border-radius:10px;padding:9px 16px;font-size:13.5px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease}
.toast.on{opacity:1;transform:translate(-50%,0)}
.steps{display:flex;flex-direction:column;gap:4px;margin:2px 0 10px}
.think{margin:0 0 12px;max-width:100%}
.think summary{display:inline-flex;align-items:center;gap:7px;cursor:pointer;list-style:none;font-size:13px;color:var(--dim);padding:3px 0;transition:color .2s ease}
.think summary::-webkit-details-marker{display:none}
.think summary:hover{color:var(--text)}
.think summary svg{width:14px;height:14px}
.think summary::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);margin-left:2px;transition:transform .2s ease}
.think[open] summary::after{transform:rotate(45deg)}
.think.on summary span{animation:breathe 1.6s ease-in-out infinite}
.think-b{margin-top:6px;padding:2px 0 2px 14px;border-left:2px solid var(--line2);color:var(--muted);font-size:13.5px;line-height:1.6;white-space:pre-wrap;max-height:340px;overflow:auto}
.runs{display:flex;flex-direction:column;gap:6px;margin:0 0 12px}
.run summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;font-size:13px;color:var(--dim);padding:6px 10px;border:1px solid var(--line);border-radius:9px;transition:background-color .2s ease,color .2s ease}
.run summary::-webkit-details-marker{display:none}
.run summary:hover{background:var(--hover);color:var(--text)}
.run summary svg{width:14px;height:14px}
.run summary b{font-weight:500;color:var(--muted)}
.run summary .bad{color:#f19a9a}
.run[open] summary{border-radius:9px 9px 0 0}
.run .pre{border-radius:0 0 10px 10px;margin:0;border-top:0}
.run .pre pre{max-height:360px;overflow:auto}
.run .outp{border-top:1px solid var(--line);padding:10px 14px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;color:var(--muted);max-height:260px;overflow:auto}
.run .outp.err{color:#f0a3a3}
.outs{display:flex;flex-wrap:wrap;gap:10px;margin:2px 0 14px}
.outs img{display:block;max-width:100%;max-height:440px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:zoom-in}
.outs .ofile{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line2);border-radius:11px;background:#141416;color:inherit;text-decoration:none;min-width:200px;max-width:320px;transition:background-color .2s ease}
.outs .ofile:hover{background:var(--hover)}
.outs .ofile b{display:block;font-size:13.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.outs .ofile small{color:var(--dim);font-size:12px}
.outs .ofile .art-ic{width:34px;height:34px}
.outs .imgw{display:flex;flex-direction:column;gap:6px;max-width:100%}
.gens{display:grid;gap:10px;margin:12px 0 2px;max-width:min(520px,100%)}.gens.multi{grid-template-columns:1fr 1fr;max-width:min(680px,100%)}
.gen{position:relative;margin:0;border-radius:14px;overflow:hidden;background:#141416;border:1px solid var(--line);animation:genIn .45s cubic-bezier(.2,.7,.2,1)}
.gen img{display:block;width:100%;height:auto;cursor:zoom-in}
.gen-dl{position:absolute;top:8px;right:8px;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:rgba(10,10,12,.62);backdrop-filter:blur(8px);color:#fff;opacity:0;transition:opacity .2s ease}
.gen:hover .gen-dl,.gen-dl:focus-visible{opacity:1}.gen-dl svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (hover:none){.gen-dl{opacity:1}}
.gen.vid video{display:block;width:100%;height:auto;background:#000}
.gen.draw{aspect-ratio:1;isolation:isolate;display:grid;place-items:center;background:#0f1013}.gen.draw.v{aspect-ratio:16/9}
.dblobs{position:absolute;inset:-20%;filter:blur(38px) saturate(1.3);opacity:.85;z-index:-2}
.dblobs i{position:absolute;width:55%;height:55%;border-radius:50%;mix-blend-mode:screen;animation:dblob 7s ease-in-out infinite alternate}
.dblobs i:nth-child(1){background:#2f6fe4;left:5%;top:10%}.dblobs i:nth-child(2){background:#8a5cf6;right:5%;top:20%;animation-duration:9s;animation-delay:-3s}
.dblobs i:nth-child(3){background:#19b6c9;left:25%;bottom:5%;animation-duration:8s;animation-delay:-5s}.dblobs i:nth-child(4){background:#e05ca8;right:20%;bottom:15%;width:35%;height:35%;animation-duration:11s;animation-delay:-2s}
@keyframes dblob{0%{transform:translate(0,0) scale(1)}50%{transform:translate(18%,-12%) scale(1.25)}100%{transform:translate(-14%,16%) scale(.85)}}
.dgrain{position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(115deg,rgba(255,255,255,.0) 0 14px,rgba(255,255,255,.05) 14px 15px),radial-gradient(circle at 50% 50%,rgba(15,16,19,0) 30%,rgba(15,16,19,.6) 100%);animation:dsweep 3s linear infinite}
@keyframes dsweep{to{background-position:60px 0,0 0}}
.dpen{position:absolute;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(10,10,14,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);animation:dpen 5.5s ease-in-out infinite}
.dpen svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@keyframes dpen{0%{left:18%;top:22%}25%{left:66%;top:30%}50%{left:56%;top:64%}75%{left:22%;top:58%}100%{left:18%;top:22%}}
.gen.draw figcaption{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:10px 12px;border-radius:12px;background:rgba(10,10,14,.6);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);font-size:13.5px}
.gen.draw figcaption b{font-weight:600;color:#fff}.gen.draw figcaption b::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:ddots 1.4s steps(4) infinite}
@keyframes ddots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.gen.draw figcaption span{margin-left:auto;color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums}
.dbar{flex-basis:100%;height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}.dbar i{display:block;height:100%;background:linear-gradient(90deg,#2f6fe4,#8a5cf6);border-radius:4px;transition:width .6s ease}
.gen.draw small{flex-basis:100%;color:rgba(255,255,255,.55);font-size:12px}
@media (prefers-reduced-motion:reduce){.dblobs i,.dpen,.dgrain{animation:none}}
.gen.wait{aspect-ratio:1;display:grid;place-items:center;background:linear-gradient(110deg,#141416 30%,#1d1f24 50%,#141416 70%);background-size:250% 100%;animation:genShim 1.6s linear infinite}
.gen.wait span{color:var(--dim);font-size:13px}
@keyframes genShim{from{background-position:100% 0}to{background-position:-150% 0}}@keyframes genIn{from{opacity:0;transform:scale(.98)}}
.outs .imgw a{font-size:12.5px;color:var(--dim);text-decoration:none}.outs .imgw a:hover{color:var(--text)}
.pickchip{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:6px 8px 6px 10px;border:1px solid rgba(94,159,232,.35);background:rgba(94,159,232,.08);border-radius:9px;font-size:13px;color:#b9d6f5;max-width:100%}
.pickchip[hidden]{display:none}
.pickchip svg{width:14px;height:14px;flex:none}
.pickchip span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickchip button{width:22px;height:22px;display:grid;place-items:center;border-radius:6px;color:inherit;flex:none}
.pickchip button:hover{background:rgba(255,255,255,.08)}
.upick{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#b9d6f5;border:1px solid rgba(94,159,232,.3);border-radius:7px;padding:2px 8px;margin-bottom:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upick svg{width:12px;height:12px}
#pPick.on,#micBtn.on{color:var(--accent-l);background:rgba(94,159,232,.12)}
#micBtn.on svg{animation:breathe 1.4s ease-in-out infinite}
.acts .ib.on{color:var(--accent-l)}
.plancard{margin:0 0 10px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02)}
.pc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13.5px}
.pc-name{font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px}
.pc-badge{font-size:10.5px;font-weight:600;letter-spacing:.3px;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.08);color:var(--muted);vertical-align:middle}
.pc-up{font-size:12px;font-weight:600;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.pc-up:hover{background:var(--accent-h)}
.pc-bar{height:4px;border-radius:3px;background:rgba(255,255,255,.08);margin:9px 0 6px;overflow:hidden}
.pc-bar i{display:block;height:100%;width:0;background:#cfcfcf;border-radius:3px;transition:width .4s ease}
.pc-bar.low i{background:#E9A35E}.pc-bar.out i{background:#E97366}
.plancard small{display:block;font-size:12px;color:var(--dim);margin-top:6px}.pc-bar+small{margin-top:0}
.lockt{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:5px;background:rgba(233,163,94,.14);color:#E9A35E;margin-left:4px;vertical-align:1px}
.opt.locked b{color:var(--muted)}
.dlg.wide{max-width:900px}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.paym{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:13.5px;color:var(--muted)}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.seg button{height:32px;padding:0 14px;border:0;border-radius:8px;background:none;color:var(--muted);font:inherit;font-size:13.5px;font-weight:550;cursor:pointer;transition:background-color .2s ease,color .2s ease}
.seg button[aria-checked=true]{background:rgba(255,255,255,.1);color:var(--text)}.seg button:hover{color:var(--text)}
#payMsg a{color:#7FB0FF}
.plan{position:relative;display:flex;flex-direction:column;gap:12px;padding:18px;border:1px solid var(--line2);border-radius:14px;background:#121214}
.plan.hot{border-color:rgba(94,159,232,.55);background:linear-gradient(180deg,var(--accent-t),transparent 60%),#18181b}
.plan .tag{position:absolute;top:-10px;left:16px;font-size:11px;font-weight:600;background:var(--accent);color:#fff;border-radius:6px;padding:2px 8px}
.plan h3{font-size:16px;font-weight:600}.plan p{font-size:13px;color:var(--muted);margin-top:2px}
.plan .price{font-size:28px;font-weight:650;letter-spacing:-.5px;line-height:1.1}
.plan .price small{font-size:13px;font-weight:400;color:var(--dim);letter-spacing:0}
.plan .price s{font-size:16px;color:var(--dim);font-weight:400;margin-right:8px}
.plan ul{list-style:none;display:flex;flex-direction:column;gap:7px;flex:1;font-size:13.5px;color:var(--muted);line-height:1.45}
.plan li{display:flex;gap:8px}.plan li svg{width:15px;height:15px;color:#72BC8F;margin-top:2px}
.plan .btn{width:100%}
.reason{padding:10px 14px;border-radius:10px;background:rgba(233,163,94,.08);border:1px solid rgba(233,163,94,.25);color:#f0c79a;font-size:13.5px}
.promo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px}
.promo input{width:200px;height:38px;background:#0f0f10;border:1px solid var(--line2);border-radius:8px;padding:0 12px;outline:0;font-size:14px;text-transform:uppercase}
.promo .msgline{margin:0}
.pnote{font-size:12.5px;color:var(--dim);margin-top:4px}.pnote a{color:var(--muted)}
@media (max-width:760px){.plans{grid-template-columns:1fr}}
.ptabs{display:flex;gap:2px;margin:-6px 0 18px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.ptabs button{padding:8px 12px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;border-radius:0}
.ptabs button:hover{color:var(--text)}.ptabs button.on{color:var(--text);border-bottom-color:var(--accent-l)}
.mini{height:30px;font-size:12.5px;padding:0 8px;border-radius:7px;border:1px solid var(--line2);background:#0f0f10;color:var(--text);outline:0}
.btn.mini{padding:0 10px;flex:none}.mini.num{width:58px}
.mrow select.mini{max-width:150px}
.ugrant{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;margin:-4px 0 8px;border:1px dashed var(--line2);border-radius:10px;font-size:13px;color:var(--muted)}
.ptag{font-size:11px;font-weight:600;padding:0 5px;border-radius:4px;background:rgba(255,255,255,.08);color:var(--muted);margin-right:2px}
.ptag.t1{background:rgba(114,188,143,.14);color:#72BC8F}.ptag.t2{background:rgba(233,163,94,.14);color:#E9A35E}
.tscroll{overflow-x:auto}
.ptable{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:8px}
.ptable th{color:var(--dim);font-weight:500;text-align:left;padding:4px 4px;white-space:nowrap}
.ptable td{padding:3px 4px}.ptable .drow td{padding-bottom:10px}
.ptable input{width:100%;min-width:64px;height:32px;background:#0f0f10;border:1px solid var(--line2);border-radius:6px;padding:0 8px;font-size:13px;outline:0}
.ptable input:disabled{opacity:.4}
.ptable.pays td{padding:7px 4px;border-top:1px solid var(--line);white-space:nowrap}
.hint{display:block;font-size:12px;color:var(--dim);margin:2px 0 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
@media (max-width:600px){.grid3{grid-template-columns:1fr}}
.copyrow{display:flex;gap:8px}.copyrow input{flex:1}.copyrow .btn{height:40px}
.st-ok{color:#72BC8F}.st-wait{color:#E9A35E}.st-bad{color:#E97366}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
@media (max-width:700px){.stats{grid-template-columns:1fr 1fr}}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 12px}.stat b{display:block;font-size:20px;font-weight:600}.stat small{display:block;font-size:12px;color:var(--dim);line-height:1.4}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px}
.bars i{flex:1;background:rgba(255,255,255,.16);border-radius:3px 3px 0 0;min-height:2px}.bars i:hover{background:rgba(255,255,255,.4)}
.bars-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin:4px 0 12px}
